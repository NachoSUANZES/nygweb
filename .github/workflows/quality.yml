name: Quality gate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=low

      - name: Type and Astro checks
        run: npm run check

      - name: Build production assets
        run: npm run build

      - name: Verify public metadata
        run: npm run check:seo

      - name: Validate Workers package
        run: npm run deploy:dry

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Build production assets
        run: npm run build

      - name: Deploy to Cloudflare Workers
        run: npm run deploy

      - name: Verify production endpoints
        shell: bash
        run: |
          set -euo pipefail
          for path in / /portfolio/ /privacy/ /robots.txt /sitemap-index.xml /llms.txt; do
            curl --fail --silent --show-error --retry 5 --retry-delay 2 \
              "https://nyginvest.com${path}" > /dev/null
          done

          test "$(curl --silent --output /dev/null --write-out '%{http_code}' \
            https://nyginvest.com/this-route-does-not-exist)" = "404"

          test "$(curl --silent --output /dev/null --write-out '%{redirect_url}' \
            https://www.nyginvest.com/)" = "https://nyginvest.com/"
